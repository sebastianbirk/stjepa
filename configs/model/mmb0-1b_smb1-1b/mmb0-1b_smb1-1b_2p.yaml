# =============================================================================
# ST-JEPA pre-training configuration — mmb0-1b_smb1-1b_2p
# =============================================================================

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  dataset_name: 'mmb0-1b_smb1-1b_2p'
  token_dict_folder_path: '/lustre/scratch126/cellgen/lotfollahi/DATASETS/tokenizer/token_dictionary_mus_musculus.pkl'
  tokenized_data_folder_path: '/lustre/scratch126/cellgen/lotfollahi/DATASETS/gold/cell-graph-tokenizer/mmb0-1b_smb1-1b_2p/mmb0-1b_smb1-1b_2p_32_None_None_None_None_None_shifted_log_knn_10_704.dataset'
  tokenizer_type: 'cell_graph'
  precomputed_split: null
  precomputed_n_nonzero_tokens: null
  test_batch_ids: null
  val_batch_ids: null
  seq_len_cell: 64
  seq_len_neighborhood: 640
  n_segments: 11
  sampling_strategy: null
  batch_size: 256
  num_workers: 16
  pin_memory: True
  sep_gene_tokens_neb: False
  use_sampler: True
  n_special_values: 200
  mega_batch_mult_max: 1000
  count_cell_norm_method: null
  count_count_norm_method: shifted_log
  count_gene_norm_method: null
  rank_cell_norm_method: null
  rank_count_norm_method: null
  rank_gene_norm_method: null
  model_input_size: 704
  n_neighs: 10

# -----------------------------------------------------------------------------
# Model architecture
# -----------------------------------------------------------------------------
meta:
  gt_type: 'combined'
  count_encoding: 'mlp'
  n_value_bins: 20
  cell_pos_enc: 'segment'
  enc_depth: 3
  enc_emb_dim: 768
  num_heads: 8
  mlp_ratio: 4
  special_tokens: []
  pos_learnable: False
  use_bfloat16: True
  use_flash_attention: True
  mlp_bias: False

# ST-JEPA-specific parameters
# -----------------------------------------------------------------------------
stjepa:
  V: 8
  proj_dim: 32                  # Much smaller bottleneck — try 32-128
  lamb: 0.02                    # Mostly invariance, light regularization
  pooling: 'mean'
  min_view_ratio: 0.2
  max_view_ratio: 0.6
  always_include_special: True
  proj_hidden_dim: null
  proj_norm: 'ln'
  n_sigreg_knots: 17
  n_sigreg_proj: 256

adversarial:
  labels: ['batch_value']
  weight: 0.1
  schedule_gamma: 2.0
  hidden_dim: 256
  n_classes:
    batch_value: 2 # Number of batches in the dataset, for adversarial batch classification head

# -----------------------------------------------------------------------------
# Optimisation
# -----------------------------------------------------------------------------
optimization:
  warmup: 1
  epochs: 1200
  start_lr: 2.0e-05
  lr: 2.0e-03
  final_lr: 2.0e-05
  weight_decay: 0.04
  final_weight_decay: 0.4
  ipe_scale: 1.25
  clip_grad: 2.0

# -----------------------------------------------------------------------------
# State / logging / checkpointing
# -----------------------------------------------------------------------------
state:
  log_freq: 20
  checkpoint_freq: 100
  checkpoint_freq_iter: 50000
  write_tag: stjepa
  folder_path: null
  load_checkpoint: False
  read_checkpoint: null
