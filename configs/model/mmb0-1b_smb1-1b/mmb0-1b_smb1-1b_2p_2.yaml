# =============================================================================
# ST-JEPA pre-training configuration — mmb0-1b_smb1-1b_2p
# =============================================================================

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  dataset_name: 'mmb0-1b_smb1-1b_2p'
  token_dict_folder_path: '/lustre/scratch126/cellgen/lotfollahi/DATASETS/tokenizer/token_dictionary_mus_musculus.pkl'
  tokenized_data_folder_path: '/lustre/scratch126/cellgen/lotfollahi/DATASETS/gold/cell-graph-tokenizer/mmb0-1b_smb1-1b_2p/mmb0-1b_smb1-1b_2p_32_None_None_None_None_None_shifted_log_knn_10_704.dataset'
  tokenizer_type: 'cell_graph'
  precomputed_split: null
  precomputed_n_nonzero_tokens: null
  test_batch_ids: null
  val_batch_ids: null
  seq_len_cell: 64
  seq_len_neighborhood: 640
  n_segments: 11
  sampling_strategy: null
  batch_size: 32
  num_workers: 16
  pin_memory: True
  sep_gene_tokens_neb: False
  use_sampler: True
  n_special_values: 200
  nz_spc: True
  mega_batch_mult_max: 1000

# -----------------------------------------------------------------------------
# Model architecture
# -----------------------------------------------------------------------------
meta:
  add_cls: False
  gt_type: 'combined'
  count_encoding: 'mlp'
  n_value_bins: 20
  cell_pos_enc: 'segment'
  enc_depth: 3
  enc_emb_dim: 768
  num_heads: 8
  mlp_ratio: 4
  special_tokens: ['batch']
  pos_learnable: False
  use_bfloat16: True
  use_flash_attention: True
  use_layer_norm: True
  nz_spc: True
  mlp_bias: False

# -----------------------------------------------------------------------------
# ST-JEPA-specific parameters
# -----------------------------------------------------------------------------
stjepa:
  V: 2                          # Number of random views per cell
  proj_dim: 256                 # Projection head output dimension
  lamb: 0.5                     # (1-lamb)*inv_loss + lamb*sigreg_loss
  pooling: 'mean'               # 'mean' | 'mean_gene' | 'cls'
  min_view_ratio: 0.2           # Min fraction of non-padded gene tokens per view
  max_view_ratio: 0.8           # Max fraction of non-padded gene tokens per view
  always_include_special: True   # Prepend special tokens to every view
  proj_hidden_dim: null          # Defaults to 4 * enc_emb_dim
  proj_norm: 'bn'               # 'bn' | 'ln' | 'none'
  n_sigreg_knots: 17
  n_sigreg_proj: 256

# -----------------------------------------------------------------------------
# Optimisation
# -----------------------------------------------------------------------------
optimization:
  warmup: 3
  epochs: 600
  start_lr: 2.0e-05
  lr: 6.0e-05
  final_lr: 2.0e-05
  weight_decay: 0.04
  final_weight_decay: 0.4
  ipe_scale: 1.25
  clip_grad: 2.0

# -----------------------------------------------------------------------------
# State / logging / checkpointing
# -----------------------------------------------------------------------------
state:
  log_freq: 20
  checkpoint_freq: 100
  checkpoint_freq_iter: 50000
  write_tag: stjepa
  folder_path: null
  load_checkpoint: False
  read_checkpoint: null
