# All keys in this YAML file must be in capital letters since
# they will be treated as environmental variables.

job_requirement:
  LSB_DEFAULT_USERGROUP: team361
  QUEUE: "training-parallel"
  NUM_NODES: 1
  NUM_GPUS_NODE: 1 # 8
  NUM_PROCESSES_NODE: 8 # 64
  MEM_NODE: 16 # 64

infiniband:
  NCCL_IB_DISABLE: 1

environment:
  ENV_PATH: "/nfs/team361/sb75/.venvs/stjepa"

artifact:
  ARTIFACT_LOCATION: "/nfs/team361/sb75/stjepa-reproducibility/artifacts/mmb0-1b_smb1-1b_2p"
  WAREHOUSE_PATH: "/nfs/team361/sb75/stjepa-reproducibility/artifacts/mmb0-1b_smb1-1b_2p"
  OUTPUT_DIR: "/nfs/team361/sb75/stjepa-reproducibility/artifacts/mmb0-1b_smb1-1b_2p"
  LOG_DIR: "/nfs/team361/sb75/stjepa-reproducibility/artifacts/mmb0-1b_smb1-1b_2p"
  EXPERIMENT_NAME: "stjepa_mmb0-1b_smb1-1b_2p"
  RUN_NAME: "run32_stjepa_adversarial"

runner_script:
  RUNNER_SCRIPT: "/nfs/team361/sb75/stjepa/src/app/training/train_model_lsf_mpirun_sanger.sh"
  TRAINING_SCRIPT_PATH: "/nfs/team361/sb75/stjepa/src/app/training/main_stjepa.py"
  BACKEND: "nccl"
  CONFIG_FILE: "/nfs/team361/sb75/stjepa/configs/model/mmb0-1b_smb1-1b/mmb0-1b_smb1-1b_2p_3.yaml"
